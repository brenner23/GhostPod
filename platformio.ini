; Ghost Pod 3.0 - Geisterdetektor-Miner im Eisbecher (Basis: ESPressMiner32, Stratum V1)
; Hardware: klassischer ESP32 (z.B. ESP32-D0WD-V3). Der COM-Port wird automatisch gesucht.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32dev
framework = arduino

board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.partitions = huge_app.csv

upload_speed = 460800   ; altes Micro-USB-Board (CP2102) - 921600 ist dort wackelig
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_unflags = -Os
build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=1
    -Wno-unused-variable
    -Wno-volatile

lib_deps =
    bblanchon/ArduinoJson@^7.2.0

